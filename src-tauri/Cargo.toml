[package]
name = "graphdesk-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
graph-core = { path = "../crates/graph-core" }
uuid.workspace = true
serde.workspace = true
serde_json = "1"
tauri-plugin-dialog = { version = "=2.8.3", default-features = false, features = ["gtk3"] }
tauri-plugin-single-instance = "=2.5.4"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
